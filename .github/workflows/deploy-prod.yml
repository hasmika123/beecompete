name: Deploy — production

# Production updates ONLY on a deliberate release tag (git tag R2 && git push origin R2)
# or manual dispatch. It promotes the EXACT image already validated on staging (build
# once, promote) — no rebuild — then refreshes the prod Compose stack + health-checks it.
#
# Tagging a docs-only merge is SAFE: it builds no image (deploy-staging paths-ignore), so
# promote walks back to the nearest ancestor that does have one. That skip is only allowed
# across commits touching **.md / docs/** / .claude/** — exactly the paths that build no
# image — so the promoted artifact is provably identical to the tagged tree. A code commit
# with no image (failed or missing build) is NEVER skipped; it fails loudly instead.
on:
  push:
    tags: ['R*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 12-char image tag (commit SHA) already built + tested on staging
        required: true

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  checks: read # verify CI passed for the promoted commit
  packages: write # add release/prod tags to the existing images

jobs:
  promote:
    # Dormant until infra is ready: set repo variable DEPLOY_ENABLED=true to activate.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      # Needed to resolve the tag: for ANNOTATED tags (git tag -a / GitHub Releases UI),
      # GITHUB_SHA is the tag OBJECT sha, not the commit — images are tagged by commit.
      - uses: actions/checkout@v4
        with:
          # Full history: resolving a release tag may need to walk back over docs-only
          # commits (see the meta step). A depth-1 checkout has no ancestors to walk.
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        env:
          # Via env, not inline interpolation — the input reaches the shell as data, never
          # as script text (injection-proof), and is validated before any use.
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if ! [[ "$INPUT_TAG" =~ ^[0-9a-f]{12}$ ]]; then
              echo "image_tag must be the 12-char lowercase commit SHA (got: '$INPUT_TAG')"; exit 1
            fi
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "release=manual-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          else
            commit=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
            # Walk back to the nearest ancestor that actually HAS images. Tagging main's HEAD
            # when that HEAD is a docs merge used to die on a bare "not found" (2026-08-20).
            sha="$commit"; resolved=""; hops=0
            for _ in $(seq 1 20); do
              short="${sha:0:12}"
              img() { docker buildx imagetools inspect "ghcr.io/${{ github.repository }}-$1:$2" >/dev/null 2>&1; }
              if img web "$short" && img api "$short"; then
                resolved="$short"; break
              fi
              # No image. Only skip this commit if EVERY path it touched is one that builds no
              # image anyway — then the parent's image is byte-identical to this tree. Otherwise
              # a build failed or never ran, and silently shipping older code than the tag claims
              # would be far worse than stopping here.
              if ! changed=$(git diff --name-only "$sha^" "$sha" 2>/dev/null) || [ -z "$changed" ]; then
                echo "::error::No image for $short and its diff is unavailable (root commit?). Stopping."; exit 1
              fi
              while IFS= read -r f; do
                case "$f" in
                  *.md|docs/*|.claude/*) ;;
                  *) echo "::error::No image for $short, but it changed '$f' — a deployable path."
                     echo "::error::That means its build failed or never ran. Fix or rebuild that"
                     echo "::error::commit; refusing to promote an older image than the tag names."
                     exit 1 ;;
                esac
              done <<< "$changed"
              echo "no image for $short (docs-only commit) — walking back to its parent"
              sha=$(git rev-parse "$sha^"); hops=$((hops+1))
            done
            if [ -z "$resolved" ]; then
              echo "::error::No image found within 20 commits of ${GITHUB_REF_NAME}."; exit 1
            fi
            if [ "$hops" -gt 0 ]; then
              echo "::notice::${GITHUB_REF_NAME} -> $resolved (walked back $hops docs-only commit(s) from ${commit:0:12})"
              echo "**Promoted \`$resolved\`**, $hops docs-only commit(s) behind tag \`${GITHUB_REF_NAME}\` (\`${commit:0:12}\`) — those commits build no image, so the artifact is identical." >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "tag=$resolved" >> "$GITHUB_OUTPUT"
            echo "release=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # Build-once-promote only means anything if the promoted commit actually passed CI.
      - name: Verify CI passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ steps.meta.outputs.tag }}" # 12-char prefix is a valid commit ref for the API
          conclusion=$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs?check_name=ci-status" \
            --jq '[.check_runs[]] | sort_by(.started_at) | last | .conclusion // "missing"')
          if [ "$conclusion" != "success" ]; then
            echo "ci-status for $sha is '$conclusion' — refusing to promote."; exit 1
          fi
          echo "CI passed for $sha."

      # Re-tag the tested :sha image as the release + a moving :prod alias. No rebuild.
      - name: Promote images (no rebuild)
        run: |
          set -euo pipefail
          for svc in web api; do
            src="ghcr.io/${{ github.repository }}-$svc:${{ steps.meta.outputs.tag }}"
            docker buildx imagetools create "$src" \
              --tag "ghcr.io/${{ github.repository }}-$svc:${{ steps.meta.outputs.release }}" \
              --tag "ghcr.io/${{ github.repository }}-$svc:prod"
          done

  deploy:
    needs: promote
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # The Caddyfile now belongs to the shared edge stack (docker-compose.edge.yml), not
      # this per-env stack, so only the prod Compose file is copied here.
      # Third-party actions holding VPS credentials are pinned to commit SHAs (supply chain).
      - name: Copy infra files to VPS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: infra/docker-compose.prod.yml
          target: ~/beecompete-prod
          strip_components: 1

      - name: Deploy + health check over SSH
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/beecompete-prod
            export IMAGE_REPO="${{ github.repository }}"
            # Validated upstream: 12-hex dispatch input or git rev-parse output only.
            export IMAGE_TAG="${{ needs.promote.outputs.tag }}"
            # Always drop the GHCR credentials from the box, even on failure.
            trap 'docker logout ghcr.io || true' EXIT
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            # --wait gates on EVERY service healthcheck (api + web), not just the API.
            if ! docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 240; then
              echo "stack did not become healthy — rolling back is manual (see infra/README). Logs:"
              docker compose -f docker-compose.prod.yml logs --tail=100
              exit 1
            fi
            echo "production healthy at ${IMAGE_TAG}"
            docker image prune -af --filter "until=168h" >/dev/null 2>&1 || true
